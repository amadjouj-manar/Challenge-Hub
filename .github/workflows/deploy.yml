name: Deploy Static Site with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v3

      - name: 🔨 Construire et pousser l’image Docker
        run: |
          docker build -t ghcr.io/${{ github.actor }}/challengehub:latest .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.actor }}/challengehub:latest

      - name: 🚀 Déployer sur le serveur
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.actor }}/challengehub:latest
            docker stop challengehub || true
            docker rm challengehub || true
            docker run -d -p 80:80 --name challengehub ghcr.io/${{ github.actor }}/challengehub:latest

